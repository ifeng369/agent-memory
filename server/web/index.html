<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>agent-memory 管理台</title>
<style>
  body{font:14px system-ui;margin:24px;max-width:1100px;color:#222}
  fieldset{border:1px solid #ddd;border-radius:8px;margin-bottom:16px;padding:12px}
  legend{font-weight:600}
  label{display:inline-block;margin:4px 8px 4px 0}
  input,select,textarea{font:inherit;padding:5px;border:1px solid #ccc;border-radius:4px}
  textarea{width:100%;min-height:60px;box-sizing:border-box}
  button{font:inherit;padding:6px 14px;cursor:pointer}
  pre{background:#f6f6f6;padding:12px;border-radius:6px;white-space:pre-wrap;word-break:break-all;min-height:80px}
  .row{margin:4px 0}
  .hidden{display:none}
  .tabs button{margin-right:6px}
  .toolbar{margin-bottom:12px}
  .doclayout{display:flex;gap:18px;align-items:flex-start}
  #docNav{width:190px;flex:none;border-right:1px solid #ddd;padding-right:10px}
  #docNav button{display:block;width:100%;text-align:left;margin-bottom:6px;border:1px solid #ddd;background:#fafafa}
  #docBody{flex:1;min-height:400px;padding:18px;border:1px solid #eee;border-radius:8px;background:#fff;line-height:1.7}
  #docBody h1,#docBody h2,#docBody h3{line-height:1.3}
  #docBody pre{white-space:pre-wrap}
  @media print{
    body{margin:0;max-width:none}
    .tabs,#admin,.toolbar,#docNav{display:none!important}
    #docs{display:block!important}
    .doclayout{display:block}
    #docBody{border:0;padding:0;font-size:12pt}
  }
</style>
</head>
<body>
<h1>agent-memory</h1>
<div class="tabs">
  <button id="tabAdmin" onclick="view('admin')">管理台</button>
  <button id="tabDocs" onclick="view('docs')">文档 / 知识库</button>
</div>

<section id="admin">
  <fieldset><legend>连接与作用范围</legend>
    <label>API <input id="base" value="/api/v1" size="30"></label>
    <label>Key <input id="key" placeholder="留空则使用默认密钥" size="20"></label>
    <label>项目 <input id="project" value="memory" size="18"></label>
    <label>Agent <input id="agent" value="web" size="14"></label>
    <label>会话 <input id="session" value="web-ui" size="14"></label>
  </fieldset>
  <fieldset><legend>写入记忆</legend>
    <textarea id="content" placeholder="要记住的内容"></textarea>
    <div class="row">
      <label>类型 <select id="type"><option>long_term</option><option>short_term</option><option>working</option><option>semantic</option><option>episodic</option></select></label>
      <label>重要性 <input id="importance" type="number" value="0.5" min="0" max="1" step="0.1"></label>
      <label>标签(逗号分隔) <input id="tags" size="24"></label>
      <button onclick="add()">添加</button>
    </div>
  </fieldset>
  <fieldset><legend>检索与列表</legend>
    <label>查询 <input id="query" size="34"></label>
    <label>阈值 <input id="threshold" type="number" value="0.5" min="0" max="1" step="0.1"></label>
    <label>条数 <input id="limit" type="number" value="10" min="1"></label>
    <button onclick="search()">语义检索</button>
    <button onclick="list()">列出本页</button>
    <label>删除 ID <input id="deleteId" size="28"></label>
    <button onclick="del()">删除</button>
  </fieldset>
  <pre id="out">就绪。</pre>
</section>

<section id="docs" class="hidden">
  <div class="toolbar">
    <button onclick="loadDocs()">刷新文档</button>
    <button onclick="window.print()">导出 PDF</button>
    <span>文档由插件在会话首次 prompt 时生成，文件变化后新会话自动更新。</span>
  </div>
  <div class="doclayout">
    <nav id="docNav"></nav>
    <article id="docBody">加载中…</article>
  </div>
</section>

<script>
const $ = id => document.getElementById(id);
const out = v => { $("out").textContent = typeof v === "string" ? v : JSON.stringify(v, null, 2); };
function view(name) {
  const docs = name === "docs";
  $("admin").classList.toggle("hidden", docs);
  $("docs").classList.toggle("hidden", !docs);
  $("tabAdmin").disabled = docs;
  $("tabDocs").disabled = !docs;
  if (docs) loadDocs();
}
function headers() {
  const h = { "Content-Type": "application/json", "X-Project-Id": $("project").value,
    "X-Agent-Id": $("agent").value, "X-Session-Id": $("session").value };
  if ($("key").value) h["X-API-Key"] = $("key").value;
  return h;
}
async function call(method, path, body) {
  try {
    const r = await fetch($("base").value + path, { method, headers: headers(), body: body ? JSON.stringify(body) : undefined });
    out(await r.json());
  } catch (e) { out("请求失败: " + e.message); }
}
function add() {
  const tags = $("tags").value.split(",").map(s => s.trim()).filter(Boolean);
  call("POST", "/memories", { content: $("content").value, type: $("type").value,
    importance: Number($("importance").value), tags });
}
function search() {
  const q = encodeURIComponent($("query").value);
  call("POST", `/memories/search?query=${q}&threshold=${$("threshold").value}&limit=${$("limit").value}`);
}
function list() { call("GET", `/memories?limit=${$("limit").value}`); }
function del() { call("DELETE", "/memories/" + encodeURIComponent($("deleteId").value)); }

let docs = [];
function esc(s) { return String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function md(s) {
  return esc(s).split("\n").map(line => {
    if (line.startsWith("### ")) return `<h3>${line.slice(4)}</h3>`;
    if (line.startsWith("## ")) return `<h2>${line.slice(3)}</h2>`;
    if (line.startsWith("# ")) return `<h1>${line.slice(2)}</h1>`;
    if (line.startsWith("- ")) return `<li>${line.slice(2)}</li>`;
    if (!line.trim()) return "<br>";
    return `<p>${line}</p>`;
  }).join("");
}
function renderDoc(doc) {
  $("docBody").innerHTML = `<h2>${doc.metadata?.kind === "usage" ? "使用说明" : "知识库"}</h2>` + md(doc.content);
}
async function loadDocs() {
  try {
    const r = await fetch($("base").value + "/memories?type=semantic&limit=100", { headers: headers() });
    const j = await r.json();
    docs = (j.data || []).filter(m => ["usage", "kb"].includes(m.metadata && m.metadata.kind));
    $("docNav").innerHTML = docs.map((d, i) =>
      `<button onclick="renderDoc(docs[${i}])">${d.metadata?.kind === "usage" ? "使用说明" : "知识库摘要"}</button>`).join("");
    if (docs.length) renderDoc(docs[0]);
    else $("docBody").innerHTML = "<p>暂无文档。插件会在会话首次 prompt 时自动生成。</p>";
  } catch (e) { $("docBody").textContent = "加载失败: " + e.message; }
}
</script>
</body>
</html>
