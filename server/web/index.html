<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>agent-memory 管理台</title>
  <link rel="stylesheet" href="vendor/reset.css" />
  <link rel="stylesheet" href="vendor/tdesign.min.css" />
  <style>
    [v-cloak] { display: none; }
    body { background: #f5f7fa; margin: 0; }
    .layout { max-width: 1400px; margin: 0 auto; padding: 24px 16px 60px; }
    .main { display: flex; gap: 16px; align-items: flex-start; }
    .sidebar { width: 200px; flex: 0 0 200px; background: #fff; border: 1px solid #e7e7e7; border-radius: 6px; padding: 12px; }
    .sidebar-title { font-size: 13px; font-weight: 600; color: #333; margin-bottom: 8px; }
    .content { flex: 1; min-width: 0; }
    .project-btn { width: 100%; text-align: left; margin-bottom: 4px; }
    .title { font-size: 22px; font-weight: 600; margin: 0 0 4px; }
    .subtitle { color: #666; font-size: 13px; margin-bottom: 16px; }
    .t-card { margin-bottom: 16px; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
    .field { display: flex; flex-direction: column; gap: 4px; }
    .field label { font-size: 12px; color: #555; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .mem-item { padding: 8px 0; border-bottom: 1px solid #eee; }
    .mem-content { white-space: pre-wrap; word-break: break-word; line-height: 1.6; }
    .mem-meta { color: #888; font-size: 12px; margin-top: 6px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .doc-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .doc-body { background: #fff; border: 1px solid #e7e7e7; border-radius: 6px; padding: 24px; line-height: 1.75; }
    .doc-body h1 { font-size: 24px; margin: 0 0 16px; }
    .doc-body h2 { font-size: 18px; margin: 20px 0 8px; }
    .doc-body p { margin: 8px 0; }
    .doc-body pre { background: #f6f8fa; padding: 12px; border-radius: 4px; overflow-x: auto; }
    .empty { color: #999; padding: 24px; text-align: center; }
    .gate { max-width: 420px; margin: 60px auto; }
    @media print {
      body * { visibility: hidden !important; }
      #docs-print, #docs-print * { visibility: visible !important; }
      #docs-print { position: absolute; left: 0; top: 0; width: 100%; }
      .no-print, .t-tabs__nav, .t-card__header { display: none !important; }
      .doc-body { border: none; padding: 0; }
    }
  </style>
</head>
<body>
<div id="app" v-cloak class="layout">
  <h1 class="title">agent-memory 管理台</h1>
  <div class="subtitle">跨会话、跨 Agent 共享记忆 · 服务端 API：{{ cfg.apiBase }}</div>

  <div v-if="!unlocked" class="gate no-print">
    <t-card title="访问验证">
      <p>服务端已启用 API Key 鉴权，请输入密钥后使用。</p>
      <div class="field">
        <t-input v-model="gateKey" type="password" placeholder="API Key" @keyup.enter="unlock(false)" />
      </div>
      <div class="toolbar">
        <t-button theme="primary" :loading="unlocking" @click="unlock(false)">解锁</t-button>
      </div>
    </t-card>
  </div>
  <div v-else class="main">
    <aside class="sidebar no-print">
      <div class="sidebar-title">项目</div>
      <div v-if="projects.length">
        <t-button v-for="p in projects" :key="p" size="small" variant="text" :theme="cfg.projectId === p ? 'primary' : 'default'" class="project-btn" @click="selectProject(p)">{{ p }}</t-button>
      </div>
      <div v-else class="empty">暂无项目</div>
    </aside>
    <div class="content">
  <div class="toolbar no-print">
    <t-button variant="outline" @click="reloadAll">刷新全部</t-button>
  </div>

  <t-tabs v-model="tab">
    <t-tab-panel value="memories" label="记忆管理">
      <div class="toolbar no-print">
        <t-button theme="primary" @click="openAdd">添加记忆</t-button>
      </div>

      <t-card title="语义检索" class="no-print">
        <div class="form-grid">
          <div class="field"><label>查询</label><t-input v-model="search.query" @enter="doSearch" placeholder="自然语言问题或关键词" /></div>
          <div class="field"><label>阈值</label><t-input-number v-model="search.threshold" :min="0" :max="1" :step="0.05" /></div>
          <div class="field"><label>条数</label><t-input-number v-model="search.limit" :min="1" :max="100" /></div>
          <div class="field">
            <label>只看 Agent</label>
            <t-input v-model="search.agentId" placeholder="留空=全部" />
          </div>
        </div>
        <div class="toolbar">
          <t-button theme="primary" @click="doSearch">检索</t-button>
          <t-button variant="outline" @click="loadMemories">列出全部</t-button>
        </div>
      </t-card>

      <t-card :title="resultTitle">
        <t-list v-if="memories.length" :split="true">
          <t-list-item v-for="m in memories" :key="m.id">
            <t-list-item-meta>
              <template #description>
                <div class="mem-content">{{ m.content }}</div>
                <div class="mem-meta">
                  <t-tag size="small" theme="primary" variant="light">{{ m.type }}</t-tag>
                  <t-tag v-for="t in m.tags || []" :key="t" size="small" variant="outline">{{ t.name || t }}</t-tag>
                  <span>ID {{ m.id }}</span>
                  <span v-if="m.metadata && m.metadata.agent_id">Agent {{ m.metadata.agent_id }}</span>
                  <span v-if="m.similarity">相似度 {{ Number(m.similarity).toFixed(2) }}</span>
                </div>
              </template>
            </t-list-item-meta>
            <template #action>
              <t-button size="small" variant="text" theme="danger" class="no-print" @click="deleteMemory(m)">删除</t-button>
            </template>
          </t-list-item>
        </t-list>
        <div v-else class="empty">暂无记忆</div>
      </t-card>

      <t-dialog :visible="addDialog" @update:visible="v => addDialog = v" header="添加记忆" :width="600" :footer="false" class="no-print">
        <div class="form-grid">
          <div class="field" style="grid-column: 1 / -1;">
            <label>内容</label>
            <t-textarea v-model="form.content" :autosize="{ minRows: 3, maxRows: 8 }" placeholder="要长期记住的事实、偏好或约定" />
          </div>
          <div class="field">
            <label>类型</label>
            <t-select v-model="form.type">
              <t-option value="long_term" label="long_term" />
              <t-option value="short_term" label="short_term" />
              <t-option value="semantic" label="semantic" />
              <t-option value="episodic" label="episodic" />
              <t-option value="working" label="working" />
            </t-select>
          </div>
          <div class="field"><label>重要性 0-1</label><t-input-number v-model="form.importance" :min="0" :max="1" :step="0.1" /></div>
          <div class="field"><label>标签（逗号分隔）</label><t-input v-model="form.tags" placeholder="preference, test" /></div>
          <div class="field"><label>过期时间（ISO，可选）</label><t-input v-model="form.expiresAt" placeholder="2027-01-01T00:00:00Z" /></div>
        </div>
        <div class="toolbar">
          <t-button theme="primary" :loading="adding" @click="addMemory">写入</t-button>
          <t-button variant="outline" @click="addDialog = false">取消</t-button>
        </div>
      </t-dialog>
    </t-tab-panel>

    <t-tab-panel value="docs" label="文档 / 知识库">
      <div class="no-print">
        <t-card title="项目文档" class="no-print">
          <div class="doc-list">
            <t-button v-for="d in docs" :key="d.id" variant="outline" :theme="docId === d.id ? 'primary' : 'default'" @click="docId = d.id">
              {{ d.metadata && d.metadata.kind === 'usage' ? '使用说明' : '知识库' }} · {{ d.created_at }}
            </t-button>
            <t-button v-if="docs.length" theme="primary" @click="exportPdf">导出 PDF</t-button>
          </div>
          <div class="toolbar"><t-button variant="outline" @click="loadDocs">刷新文档</t-button></div>
        </t-card>
      </div>
      <div id="docs-print">
        <div v-if="currentDoc" class="doc-body" v-html="renderMarkdown(currentDoc.content)"></div>
        <div v-else class="empty">暂无项目文档，开发者会话首次提问时会自动生成。</div>
      </div>
    </t-tab-panel>
  </t-tabs>
    </div>
  </div>
</div>

<script src="vendor/vue.global.prod.js"></script>
<script src="vendor/tdesign.min.js"></script>
<script>
(function () {
  const { createApp, ref, reactive, computed, onMounted } = Vue;
  const components = ['Button','Card','Input','Textarea','Select','Option','InputNumber','Tag','Tabs','TabPanel','List','ListItem','ListItemMeta','Checkbox','Switch','Dialog','DialogCard','InputAdornment','InputGroup','Table','TagInput'];
  const kebab = s => 't-' + s.replace(/[A-Z]/g, m => '-' + m.toLowerCase()).replace(/^-/, '');

  const app = createApp({
    setup() {
      const cfg = reactive({
        apiBase: location.origin,
        apiKey: '',
        projectId: 'default',
        agentId: 'web',
        sessionId: ''
      });
      const unlocked = ref(false);
      const gateKey = ref('');
      const unlocking = ref(false);
      const tab = ref('memories');
      const form = reactive({ content: '', type: 'long_term', importance: 0.8, tags: '', expiresAt: '' });
      const search = reactive({ query: '', threshold: 0.5, limit: 20, agentId: '' });
      const memories = ref([]);
      const docs = ref([]);
      const docId = ref('');
      const resultTitle = ref('记忆列表');
      const addDialog = ref(false);
      const adding = ref(false);
      const currentDoc = computed(() => docs.value.find(d => d.id === docId.value) || docs.value[0] || null);
      const projects = ref([]);
      async function loadProjects() {
        try {
          const found = [];
          for (let offset = 0; ; offset += 100) {
            const r = await api('/api/v1/memories?limit=100&offset=' + offset, {}, false);
            const batch = r.data || [];
            batch.forEach(m => { const p = m.metadata && m.metadata.project_id; if (p) found.push(p); });
            if (batch.length < 100) break;
          }
          projects.value = Array.from(new Set(found)).sort();
        } catch (e) { msg('error', e.message); }
      }
      function selectProject(p) { cfg.projectId = p; saveConfig(); reloadAll(); }

      function headers(includeProject = true) {
        const h = { 'Content-Type': 'application/json' };
        if (cfg.apiKey) h['X-API-Key'] = cfg.apiKey;
        if (includeProject && cfg.projectId) h['X-Project-Id'] = cfg.projectId;
        if (cfg.agentId) h['X-Agent-Id'] = cfg.agentId;
        if (cfg.sessionId) h['X-Session-Id'] = cfg.sessionId;
        return h;
      }
      async function api(path, options = {}, includeProject = true) {
        const res = await fetch(cfg.apiBase.replace(/\/$/, '') + path, { ...options, headers: { ...headers(includeProject), ...(options.headers || {}) } });
        const text = await res.text();
        let data; try { data = JSON.parse(text); } catch (e) { data = text; }
        if (!res.ok) {
          const detail = data && data.detail;
          throw new Error(typeof detail === 'string' ? detail : (detail ? JSON.stringify(detail) : ('HTTP ' + res.status)));
        }
        return data;
      }
      function msg(type, text) {
        const fn = TDesign.MessagePlugin[type];
        if (fn) fn(text); else console.log(type, text);
      }
      function parseTags(s) {
        return String(s || '').split(',').map(x => x.trim()).filter(Boolean);
      }
      function saveConfig() {
        localStorage.setItem('agent-memory-web', JSON.stringify(cfg));
      }
      async function testConnection() {
        try {
          await api('/api/v1/memories?limit=1');
          msg('success', '连接正常，密钥有效');
          return true;
        } catch (e) { msg('error', '连接失败：' + e.message); return false; }
      }
      async function unlock(silent) {
        cfg.apiKey = gateKey.value.trim() || cfg.apiKey;
        if (!cfg.apiKey) { if (!silent) msg('warning', '请输入 API Key'); return; }
        unlocking.value = true;
        try {
          await api('/api/v1/memories?limit=1');
          unlocked.value = true;
          localStorage.setItem('agent-memory-web', JSON.stringify(cfg));
          reloadAll();
          if (!silent) msg('success', '已解锁');
        } catch (e) {
          if (!silent) msg('error', '密钥无效：' + e.message);
        } finally { unlocking.value = false; }
      }
      async function loadMemories() {
        try {
          const r = await api('/api/v1/memories?limit=100');
          memories.value = r.data || [];
          resultTitle.value = '记忆列表（' + memories.value.length + '）';
        } catch (e) { msg('error', e.message); }
      }
      async function doSearch() {
        try {
          const q = new URLSearchParams({ query: search.query, threshold: String(search.threshold), limit: String(search.limit) });
          if (search.agentId) q.set('agent_id', search.agentId);
          const r = await api('/api/v1/memories/search?' + q.toString(), { method: 'POST' });
          memories.value = r.data || [];
          resultTitle.value = '检索结果（' + memories.value.length + '）';
        } catch (e) { msg('error', e.message); }
      }
      function openAdd() {
        form.content = '';
        form.type = 'long_term';
        form.importance = 0.8;
        form.tags = '';
        form.expiresAt = '';
        addDialog.value = true;
      }
      async function addMemory() {
        if (!form.content.trim()) { msg('warning', '请输入内容'); return; }
        adding.value = true;
        const body = { content: form.content, type: form.type, importance: Number(form.importance), tags: parseTags(form.tags) };
        if (form.expiresAt) body.expires_at = form.expiresAt;
        try {
          await api('/api/v1/memories', { method: 'POST', body: JSON.stringify(body) });
          addDialog.value = false;
          msg('success', '已写入');
          await loadMemories();
        } catch (e) { msg('error', e.message); }
        finally { adding.value = false; }
      }
      function deleteMemory(m) {
        TDesign.DialogPlugin.confirm({
          header: '删除记忆',
          body: '确定删除这条记忆吗？此操作不可撤销。',
          onConfirm: async () => {
            try { await api('/api/v1/memories/' + m.id, { method: 'DELETE' }); msg('success', '已删除'); await loadMemories(); }
            catch (e) { msg('error', e.message); }
          }
        });
      }
      async function loadDocs() {
        try {
          const r = await api('/api/v1/memories?type=semantic&limit=100');
          docs.value = (r.data || []).filter(m => m.metadata && (m.metadata.kind === 'usage' || m.metadata.kind === 'kb'));
          if (!docId.value && docs.value.length) docId.value = docs.value[0].id;
        } catch (e) { msg('error', e.message); }
      }
      function exportPdf() { window.print(); }
      function escapeHtml(s) {
        return String(s || '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
      }
      function renderMarkdown(s) {
        return String(s || '').split('\n').map(line => {
          const t = escapeHtml(line.trimEnd());
          if (t.startsWith('### ')) return '<h3>' + t.slice(4) + '</h3>';
          if (t.startsWith('## ')) return '<h2>' + t.slice(3) + '</h2>';
          if (t.startsWith('# ')) return '<h1>' + t.slice(2) + '</h1>';
          if (t.startsWith('- ')) return '<p>• ' + t.slice(2) + '</p>';
          if (!t) return '<p></p>';
          return '<p>' + t + '</p>';
        }).join('');
      }
      function reloadAll() { loadProjects(); loadMemories(); loadDocs(); }
      onMounted(() => {
        try {
          const saved = JSON.parse(localStorage.getItem('agent-memory-web') || 'null');
          if (saved) Object.assign(cfg, saved);
        } catch (e) {}
        gateKey.value = cfg.apiKey;
        if (cfg.apiKey) unlock(true);
      });
      return { cfg, unlocked, gateKey, unlocking, unlock, tab, form, search, memories, docs, docId, currentDoc, resultTitle, addDialog, adding, projects, saveConfig, testConnection, loadMemories, doSearch, openAdd, addMemory, deleteMemory, loadDocs, loadProjects, selectProject, exportPdf, renderMarkdown, reloadAll };
    }
  });
  components.forEach(name => {
    const comp = TDesign[name];
    if (comp) app.component(kebab(name), comp);
  });
  app.mount('#app');
})();
</script>
</body>
</html>
