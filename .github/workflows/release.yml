name: Build and push image

on:
  push:
    tags:
      - "*"

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/agent-memory
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: HF_ENDPOINT=https://hf-mirror.com

      # 私有仓库推出来的包默认是私有，尝试设为公开；失败可在 GHCR 页面手动改
      - name: Make GHCR package public
        continue-on-error: true
        run: gh api -X PATCH /user/packages/container/agent-memory -f visibility=public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
